apiVersion: v1
kind: ConfigMap
metadata:
  name: plain-language-desk-config
  namespace: plain-language-desk
  labels:
    app.kubernetes.io/name: plain-language-desk
data:
  # One wire protocol: any OpenAI-compatible chat-completions endpoint.
  # In-cluster example; a cloud endpoint is the same shape.
  INFERENCE_BASE_URL: "http://your-openai-compatible-endpoint/v1"
  INFERENCE_MODEL: "glm-5.3-flash"
  INFERENCE_TIMEOUT: "120"
  INFERENCE_MAX_RETRIES: "2"
  # AgentCore Runtime probes /ping on the container port; the default is 8080.
  PORT: "8080"
  BAR: "80"
  MAX_ROUNDS: "3"
  LOG_LEVEL: "INFO"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: true
          tags: plain-language-desk:${{ github.sha }}

      - name: Proof — no shell in the runtime image
        run: |
          if docker run --rm --entrypoint /bin/sh plain-language-desk:${{ github.sha }} -c 'echo pwned' 2>/dev/null; then
            echo '::error::the runtime image contains a shell'
            exit 1
          fi
          echo "shell exec refused, as required"

      - name: Proof — non-root, caps dropped, read-only rootfs, score round-trip
        run: |
          CID=$(docker run -d --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 \
            plain-language-desk:${{ github.sha }})
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ping
          curl -fsS http://localhost:8080/healthz
          curl -fsS -X POST http://localhost:8080/score \
            -H 'Content-Type: application/json' \
            -d '{"text":"Short active sentence. You can read it in one pass."}' | grep -q '"band"'
          docker rm -f "$CID" >/dev/null

      - name: Proof — PORT env override honored in the container
        run: |
          CID=$(docker run -d --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e PORT=8099 -p 8099:8099 \
            plain-language-desk:${{ github.sha }})
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8099/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8099/ping
          curl -fsS http://localhost:8099/healthz
          docker rm -f "$CID" >/dev/null

      - name: Scan — fail on CRITICAL or HIGH
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: plain-language-desk:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: SBOM
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: plain-language-desk:${{ github.sha }}
          format: 'cyclonedx'
          output: 'sbom.cdx.json'
          exit-code: '0'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    # Consumer-ready image: main publishes to GHCR so deploy/k8s and AgentCore
    # (`agentcore deploy`) consume the same artifact the CI proofs ran against.
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          # AgentCore Runtime microVMs (and Apple Silicon hosts) run arm64;
          # an amd64-only image cannot deploy there.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

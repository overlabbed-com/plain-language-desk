[project]
name = "plain-language-desk"
version = "0.1.0"
description = "Standalone prose scoring and improvement against the FAA plain-language standard (HTTP + MCP, any OpenAI-compatible engine, hardened container)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "fastmcp>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plain_language_desk"]
